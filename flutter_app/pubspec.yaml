name: sentences
description: "Audio phrase trainer: FSRS-scheduled IT/EN sentence pairs from disk, driven by an ESP32 BLE button remote."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Local folder selection + full-disk read of the chosen sentence folder.
  file_picker: ^10.3.10
  permission_handler: ^12.0.3
  path: ^1.9.1
  # Small key/value persistence: last folder, paired BLE device, FSRS state.
  shared_preferences: ^2.5.5
  # Background audio that keeps playing with the screen off.
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  # BLE central for the ESP32-C3 button remote (Nordic UART Service).
  flutter_blue_plus: ^2.3.12
  # FSRS spaced-repetition scheduler.
  fsrs: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
